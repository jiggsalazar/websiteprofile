name: Deploy website to DreamHost

on:
  push:
    branches: [main]
    paths:
      - 'static-site/**'
      - 'scripts/deploy_dreamhost.py'
      - 'scripts/dreamhost_known_hosts'
      - 'scripts/requirements-deploy.txt'
      - 'tests/**'
      - '.github/workflows/deploy-dreamhost.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamhost-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate website and deployment tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/contact_forms.test.cjs
          php -l static-site/contact/send.php
          php tests/contact_endpoint_test.php
          python scripts/deploy_dreamhost.py --check
      - name: Check hosting credential
        env:
          DREAMHOST_SFTP_PASSWORD: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
        run: |
          if [ -z "$DREAMHOST_SFTP_PASSWORD" ]; then
            echo '::error::Add the DREAMHOST_SFTP_PASSWORD repository secret in Settings > Secrets and variables > Actions, then rerun this workflow.'
            exit 1
          fi
      - name: Install SFTP client
        run: python -m pip install -r scripts/requirements-deploy.txt
      - name: Upload website and verify madebyjigg.com
        env:
          DREAMHOST_SFTP_PASSWORD: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
          DEPLOY_COMMIT: ${{ github.sha }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/deploy_dreamhost.py
